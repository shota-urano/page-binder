name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # e2e(connectedAndroidTest) はエミュレータ必須のため CI では回さない（ローカル make verify で実行）
      - run: make verify-fast test android-lint build
